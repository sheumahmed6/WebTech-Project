<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login</title>
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="admin-login.css">
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="brand">Badminton Turf</a>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="customer-login.html">Customer Login / Sign Up</a>
        <a href="admin-login.html" class="active">Admin Login</a>
      </nav>
    </div>
  </header>

  <main class="container auth-wrap">
    <div class="card">
      <h2>Admin login</h2>
       
      <div class="demo-box">
        
        Username: <code id="demo-username"></code><br>
        Password: <code id="demo-password"></code>
      </div>
      

      <div id="message" class="alert" hidden></div>

      <form id="admin-form">
        <div class="form-group">
          <label for="admin-username">Username</label>
          <input type="text" id="admin-username" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label for="admin-password">Password</label>
          <input type="password" id="admin-password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Log in</button>
      </form>
    </div>
  </main>

  <script src="storage.js"></script>
  <script src="utils.js"></script>
  <script src="admin-login.js"></script>
</body>
</html>
