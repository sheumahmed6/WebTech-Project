<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Badminton Turf</title>
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="home.css">
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="brand">Badminton Turf</a>
      <nav class="nav">
        <a href="index.html" class="active">Home</a>
        <a href="customer-login.html" id="nav-customer-login">Customer Login / Sign Up</a>
        <a href="booking.html" id="nav-booking" hidden>Book a Slot</a>
        <a href="admin-login.html" id="nav-admin">Admin Login</a>
        <button type="button" class="btn btn-light btn-sm" id="nav-logout" hidden>Logout</button>
      </nav>
    </div>
  </header>

  <!-- Hero: turf name, short line, main call to action, and a court drawing -->
  <section class="hero">
    <div class="container hero-inner">
      <div class="hero-text">
        <h1 id="turf-name">Badminton Turf</h1>
        <p id="turf-tagline"></p>
        <a href="customer-login.html" class="btn btn-hero" id="hero-cta">Log in to book a court</a>
      </div>

      <!-- Doubles court, drawn to scale (13.4 m x 6.1 m) -->
      
    </div>
  </section>

  <main class="container">
    <div class="info-grid">

      <section class="card">
        <h2>Courts</h2>
        <p id="court-count"></p>
        <ul id="court-list"></ul>
      </section>

      <section class="card">
        <h2>Opening hours</h2>
        <p id="open-days"></p>
        <p class="big" id="open-hours"></p>
        <p class="muted">Courts are booked in one-hour slots.</p>
      </section>

      <section class="card">
        <h2>Price</h2>
        <p class="big" id="price"></p>
        <p class="muted">Per court, per hour.</p>
      </section>

      <section class="card">
        <h2>Find us</h2>
        <p id="address"></p>
        <p>Phone: <span id="phone"></span></p>
        <p>Email: <span id="email"></span></p>
      </section>

      <section class="card wide">
        <h2>Rules</h2>
        <ul id="rules-list"></ul>
      </section>

    </div>
  </main>

  <footer class="site-footer"></footer>

  <script src="storage.js"></script>
  <script src="utils.js"></script>
  <script src="home.js"></script>
</body>
</html>
