<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customer Login</title>
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="customer-login.css">
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="brand">Badminton Turf</a>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="customer-login.html" class="active">Customer Login / Sign Up</a>
        <a href="admin-login.html">Admin Login</a>
      </nav>
    </div>
  </header>

  <main class="container auth-wrap">
    <div class="card">

      <div class="tabs" role="tablist">
        <button type="button" class="tab active" id="tab-login" role="tab" aria-selected="true">Log in</button>
        <button type="button" class="tab" id="tab-signup" role="tab" aria-selected="false">Sign up</button>
      </div>

      <div id="message" class="alert" hidden></div>

      <!-- Log in -->
      <form id="login-form">
        <div class="form-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" autocomplete="email" required>
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Log in</button>
      </form>

      <!-- Sign up -->
      <form id="signup-form" hidden>
        <div class="form-group">
          <label for="signup-name">Full name</label>
          <input type="text" id="signup-name" autocomplete="name" required>
        </div>
        <div class="form-group">
          <label for="signup-email">Email</label>
          <input type="email" id="signup-email" autocomplete="email" required>
        </div>
        <div class="form-group">
          <label for="signup-phone">Phone (optional)</label>
          <input type="tel" id="signup-phone" autocomplete="tel">
        </div>
        <div class="form-group">
          <label for="signup-password">Password (at least 6 characters)</label>
          <input type="password" id="signup-password" minlength="6" autocomplete="new-password" required>
        </div>
        <div class="form-group">
          <label for="signup-confirm">Confirm password</label>
          <input type="password" id="signup-confirm" minlength="6" autocomplete="new-password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Create account</button>
      </form>

    </div>
  </main>

  <script src="storage.js"></script>
  <script src="utils.js"></script>
  <script src="customer-login.js"></script>
</body>
</html>
